name: NEXUS
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  NEXUS:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.nexusmission.monitor
        PRODUCT_NAME: NEXUS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
schemes:
  NEXUS:
    build:
      targets:
        NEXUS: all
